<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스마트공장 KPI 대시보드</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div>
    <h1>📊 스마트공장 KPI 대시보드</h1>
    <p class="sub">1공장 · 조립 라인 A <span id="clock" class="clock"></span> <span id="liveDot" class="live">● LIVE</span></p>
  </div>
  <div class="oee-hero">
    <svg viewBox="0 0 120 120" class="gauge">
      <circle cx="60" cy="60" r="52" class="gauge-bg" />
      <circle id="oeeArc" cx="60" cy="60" r="52" class="gauge-fg" />
    </svg>
    <div class="oee-text"><span id="oeeVal">0</span><small>%</small><span class="oee-label">OEE</span></div>
  </div>
</header>

<main>
  <section class="kpi-row">
    <div class="kpi"><span class="k-label">가동률</span><span class="k-val" id="kAvail">0%</span><div class="bar"><div id="bAvail" class="fill"></div></div></div>
    <div class="kpi"><span class="k-label">성능</span><span class="k-val" id="kPerf">0%</span><div class="bar"><div id="bPerf" class="fill"></div></div></div>
    <div class="kpi"><span class="k-label">품질(양품률)</span><span class="k-val" id="kQual">0%</span><div class="bar"><div id="bQual" class="fill"></div></div></div>
    <div class="kpi"><span class="k-label">시간당 생산량</span><span class="k-val" id="kTput">0</span><div class="bar"><div id="bTput" class="fill"></div></div></div>
  </section>

  <section class="panel">
    <h2>📈 생산량 추이 (최근 60분)</h2>
    <canvas id="chartTput" width="680" height="180"></canvas>
  </section>

  <section class="panel">
    <h2>⚙️ 설비 상태</h2>
    <div id="machines" class="machines"></div>
  </section>

  <section class="panel">
    <h2>🔔 알람</h2>
    <ul id="alarms" class="alarms"></ul>
  </section>
</main>

<footer>시뮬레이션 데이터 · 새로고침하면 리셋됩니다</footer>
<script src="app.js"></script>
</body>
</html>
